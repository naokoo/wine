function pauseAll(){stopTick();if(session&&screen==='quiz'){if(session.deadline&&!session.answered){session.remaining=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));session.deadline=null}state.session=session;save()}if(essayDeadline){essayRemaining=Math.max(0,Math.ceil((essayDeadline-Date.now())/1000));essayDeadline=null}if(rehearsalDeadline){rehearsalRemaining=Math.max(0,Math.ceil((rehearsalDeadline-Date.now())/1000));rehearsalDeadline=null}}

function begin(cat,ids,limit=0){if(!ids.length){review();return}stopTick();session={dataRevision:DATA_REVISION,cat,ids,index:0,results:[],combo:0,limit,remaining:limit,deadline:limit?Date.now()+limit*1000:null,answered:false,choice:[],hinted:false,order:null,started:Date.now(),xp:0};state.session=session;save();screen='quiz';renderQuestion()}

function current(){if(session.cat==='sequence'){const i=session.index;return{id:'sequence-'+i,cat:'service',text:'次に行うことを選んでください。',options:SEQUENCE.map(x=>x[0]),answers:[SEQUENCE[i][0]],context:'澱のある赤ワイン。注文が確定し、静かに運ばれたボトルを、デカンタージュしてサービスする練習場面です。器具は事前準備済み。ホスト確認は移し替え後に行う設定です。',explanation:SEQUENCE[i][1],hint:'この練習の流れ：提示 → 抜栓 → 状態確認 → 移し替え準備 → 移し替え → ホスト確認 → サービス。'}}return BY_ID[session.ids[session.index]]}
function renderQuestion(){screen='quiz';const q=current();if(!q){state.session=null;session=null;save();home();toast('保存された問題を開けませんでした。新しく練習してください。');return}if(!validOrder(session.order,q.options)){session.order=shuffle(q.options);session.choice=(session.choice||[]).filter(v=>q.options.includes(v));}selected=session.choice||[];revealed=session.answered;const r=session.results[session.index];mount('<div class="play-wrap"><div class="play-top"><button class="back" data-action="home">← 中断してホーム</button><span class="crumb">'+CATEGORY[session.cat]+'</span></div><div class="quiz-meta"><span>QUESTION '+String(session.index+1).padStart(2,'0')+' / '+session.ids.length+'</span><span>'+session.combo+' 連続正解</span><span id="questionTimer" class="timer">'+(session.limit?formatTime(session.remaining):'時間制限なし')+'</span></div><div class="bar quiz-progress"><i style="width:'+(session.index/session.ids.length*100)+'%"></i></div><section class="paper"><div class="eyebrow">'+CATEGORY[q.cat]+'</div>'+(session.cat==='sequence'&&session.index?'<p class="small muted">直前：'+esc(SEQUENCE[session.index-1][0])+'</p>':'')+(q.context?'<div class="question-context"><span class="context-name">'+esc(q.contextLabel||'サービスの場面')+'</span><p>'+esc(q.context)+'</p></div>':'')+'<h1 class="question-title">'+esc(q.text)+'</h1><p class="quiz-help">'+(q.multi?'2つ選択すると採点できます。完全一致で正解です。':'最も適切なものを1つ選んでください。')+'</p><div class="options" role="'+(q.multi?'group':'radiogroup')+'" aria-label="回答の選択肢">'+session.order.map((o,i)=>optionHTML(q,o,i,r)).join('')+'</div><div id="questionFeedback">'+(r?feedbackHTML(q,r):session.hinted?'<div class="notice">ヒント：'+esc(q.hint)+'<br>この問題の正解XPは半分になります。</div>':'')+'</div><div class="actions">'+(r?'<span class="feedback-xp">＋'+r.xp+' XP</span><button class="primary dark" data-action="next">'+(session.index+1===session.ids.length?'結果を見る':'次の問題 →')+'</button>':'<button class="ghost" data-action="hint" '+(session.hinted?'disabled':'')+'>ヒント</button><button id="submitAnswer" class="primar function choose(i){if(!session||session.answered)return;const q=current(),v=session.order[i];if(q.multi){if(selected.includes(v))selected=selected.filter(x=>x!==v);else if(selected.length<q.answers.length)selected.push(v);else{toast('選択済みの項目を外してから選んでください。');return}}else selected=[v];session.choice=[...selected];document.querySelectorAll('.option').forEach((b,j)=>{b.classList.toggle('selected',selected.includes(session.order[j]));b.setAttribute('aria-checked',String(selected.includes(session.order[j])));b.setAttribute('tabindex',q.multi||selected.includes(session.order[j])?'0':'-1')});$('submitAnswer').disabled=selected.length!==q.answers.length;save()}
function isCorrect(q,choice){return choice.length===q.answers.length&&q.answers.every(a=>choice.includes(a))}
function answer(timeout=false){if(!session||session.answered)return;const q=current();if(!timeout&&selected.length!==q.answers.length)return;stopTick();const correct=!timeout&&isCorrect(q,selected);session.combo=correct?session.combo+1:0;const xp=correct?(session.hinted?10:20)+Math.min(10,Math.max(0,session.combo-1)*2):5;session.answered=true;session.deadline=null;session.results.push({id:q.id,choice:[...selected],correct,xp,timeout});session.xp+=xp;state.xp+=xp;state.total++;if(correct)state.correct++;if(BY_ID[q.id]){if(correct)state.weak=state.weak.filter(x=>x!==q.id);else if(!state.weak.includes(q.id))state.weak.push(q.id)}touchDay();state.session=session;save();renderQuestion();announce((correct?'正解です。':timeout?'時間になりました。':'不正解です。')+'正解：'+q.answers.join('、')+'。'+q.explanation);$('questionFeedback')?.scrollIntoView({block:'nearest',behavior:'smooth'})}

function formatTime(s){return String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0')}
function startQuestionTimer(){stopTick();if(!session?.limit||session.answered)return;if(!session.deadline)session.deadline=Date.now()+session.remaining*1000;const tick=()=>{session.remaining=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));const el=$('questionTimer');if(el){el.textContent=formatTime(session.remaining);el.classList.toggle('danger',session.remaining<=10)}if(session.remaining<=0)answer(true)};tick();if(!session.answered)timerHandle=setInterval(tick,250)}
function finish(){if(!session||session.finished)return;stopTick();session.finished=true;const s=session;const correct=s.results.filter(r=>r.correct).length,pct=Math.round(correct/s.ids.length*100);const bonus=Math.round(20*correct/s.ids.length);state.xp+=bonus;s.xp+=bonus;state.best[s.cat]=Math.max(state.best[s.cat]||0,pct);if(['tasting','spirits','service'].includes(s.cat)&&pct>=80)state.seals[s.cat]=true;state.session=null;save();screen='result';mount('<div class="play-wrap"><div class="play-top"><button class="back" data-action="home">← ホーム</button><span class="crumb">'+CATEGORY[s.cat]+'</span></div><section class="paper"><div class="result-head"><div class="eyebrow">QUEST COMPLETE</div><h1 style="margin-top:8px">'+(pct>=80?'いい調子です。':pct>=50?'手掛かりが見えてきました。':'解説から、もう一度。')+'</h1><div class="score">'+pct+'<small> %</small></div><p class="muted">'+(pct>=80?'この感覚を、実際のワインとサービスにつなげましょう。':s.cat==='sequence'?'下の振り返りで、選んだ手順と正しい流れを見比べましょう。':'間違えた問題は「苦手を復習」に残っています。')+'</p></div><div class="score-grid"><div><strong>'+correct+' / '+s.ids.length+'</strong><small>正解数</small></div><div><strong>＋'+s.xp+'</strong><small>獲得XP</small></div><div><strong>'+state.best[s.cat]+'%</strong><small>このモードの最高</small></div></div>'+(['tasting','spirits','service'].includes(s.cat)&&pct>=80?'<div class="notice">◇ '+CATEGORY[s.cat]+'のステージバッジを獲得しました。</div>':'')+'<p class="small muted">得点はゲーム内の正解率です。実試験の合否や実技の完成度を判定するものではありません。</p><div class="actions"><button class="ghost" data-action="home">ホームへ</button><button class="primary dark" data-action="retry">もう一度挑戦 →</button></div><div class="section-label"><strong>今回の振り返り</strong></div>'+s.results.map((r,i)=>{const q=s.cat==='sequence'?{text:'手順 '+(i+1)+'：この場面で次に行うことは？',explanation:SEQUENCE[i][1],answers:[SEQUENCE[i][0]]}:BY_ID[r.id];return '<div class="review-line"><strong><span class="result-bullet" style="color:'+(r.correct?'var(--green)':'var(--rose)')+'">'+(r.correct?'✓':'×')+'</span>'+esc(q.text)+'</strong><p>あなたの回答：'+(r.choice.length?r.choice.map(es function renderEssay(){stopTick();screen='essay';const e=ESSAYS.find(x=>x.id===essayId);const draft=state.drafts[essayId]||'';mount('<div class="play-wrap"><div class="play-top"><button class="back" data-action="home">← ホーム</button><span class="crumb">論述トレーニング</span></div><section class="paper"><div class="eyebrow">TRAINING 03 · 三次審査／二次試験日に実施</div><h1 class="setup-heading">自分の言葉で、伝える。</h1><label class="setup-field">練習テーマ<select id="essayTopic">'+ESSAYS.map(e=>'<option value="'+e.id+'" '+(e.id===essayId?'selected':'')+'>'+esc(e.title)+(state.essayDone.includes(e.id)?' ✓':'')+'</option>').join('')+'</select></label><div class="question-context"><p>'+esc(e.prompt)+'</p></div><div class="quiz-meta"><span>練習用の目標時間：5分</span><span id="essayTimer" style="font-variant-numeric:tabular-nums;font-weight:700">'+formatTime(essayRemaining)+'</span><button class="ghost" data-action="essayTimer">'+(essayDeadline?'一時停止':'タイマー開始')+'</button></div><label for="essayText" class="sr-only">論述の答案</label><textarea id="essayText" placeholder="結論 → 理由 → 具体的な対応、の順で書いてみましょう。">'+esc(draft)+'</textarea><div class="essay-count"><span id="draftStatus" class="muted">'+(storageOK?'このブラウザーに自動保存':'保存できません')+'</span><span id="charCount">'+essayChars(draft)+'字 <span class="muted">／目安150〜220字</span></span></div><p class="small muted">文字数は空白・改行を除いた値です。出題と文字数、時間は練習用の設定です。</p><div class="actions"><button class="ghost" data-action="essayNext">次のテーマ</button><button class="primary dark" data-action="essayReveal">参考答案と見比べる</button></div><div id="essayReview">'+(essayReveal?essayReviewHTML(e):'')+'</div></section></div>');if(essayDeadline)essayTick()}

function essayTick(){stopTick();const tick=()=>{essayRemaining=Math.max(0,Math.ceil((essayDeadline-Date.now())/1000));const n=$('essayTimer');if(n)n.textContent=formatTime(essayRemaining);if(essayRemaining<=0){essayDeadline=null;stopTick();toast('5分経過しました。書いた答案を振り返りましょう。');const b=document.querySelector('[data-action="essayTimer"]');if(b)b.textContent='もう5分計る'}};tick();if(essayDeadline)timerHandle=setInterval(tick,250)}
function renderRehearsal(){pauseAll();screen='rehearsal';mount('<div class="play-wrap"><div class="play-top"><button class="back" data-action="stage" data-id="service">← サービス実技</button><span class="crumb">実物でリハーサル</span></div><section class="paper"><div class="eyebrow">PRACTICE WITH YOUR HANDS</div><h1 class="setup-heading">手を動かして、流れを覚える。</h1><p class="muted">ボトル、ソムリエナイフ、グラス、デカンター、布などを用意します。水入りボトルでも動作を練習できます。澱の分離は実物で別途確認しましょう。</p><div class="notice">7分はこのゲームの練習用目標です。本番の制限時間、課題、トレーの使用方法は受験票・公式案内に従ってください。</div><div id="rehearsalTime" class="timer-display">'+formatTime(rehearsalRemaining)+'</div><div class="timer-controls"><button class="primary dark" data-action="rehearsalTimer">開始／再開</button><button class="ghost" data-action="rehearsalReset">7分に戻す</button></div><h2>終わったらセルフチェック</h2><div class="rubric">'+CHECKS.map((c,i)=>'<label class="checkrow"><input type="checkbox" data-rehearsal-check="'+i+'" '+(rehearsalChecks[i]?'checked':'')+'><span>'+c+'</span></label>').join('')+'</div><p id="rehearsalScore" class="muted">確認できた動作：'+rehearsalChecks.filter(Boolean).length+' / '+CHECKS.length+'</p><div class="actions"><a href="'+SOURCES.tray+'" target="_blank" rel="noopener noreferrer" class="small">公式：トレーの使用方法</a><button class="primary dark" data-action="rehearsalSave">練習を記録する</button></div><p class="small muted">画面では手技の正確さを採点できません。可能なら講師や動画で動作を確認してください。</p>'+(state.rehearsal?'<p class="small muted">前回：'+esc(state.rehearsal.date)+' · 自己確認 '+state.rehearsal.count+' / '+(state.rehearsal.total??CHECKS.length)+'</p>':'')+'</section></div>')}
function rehearsalTick(){stopTick();const tick=()=>{rehearsalRemaining=Math.max(0,Math.ceil((rehearsalDeadline-Date.now())/1000));const el=$('rehearsalTime');if(el)el.textContent=formatTime(rehearsalRemaining);if(rehearsalRemaining<=0){rehearsalDeadline=null;stopTick();toast('7分経過しました。動作を振り返ってください。');const b=document.querySelector('[data-action="rehearsalTimer"]');if(b)b.textContent='7分でもう一度'}};tick();if(rehearsalDeadline)timerHandle=setInterval(tick,250)}
function showSources(){pauseAll();screen='sources';mount('<div class="play-wrap"><div class="play-top"><button class="back" data-action="home">← ホーム</button></div><section class="paper"><div class="eyebrow">ABOUT THIS TRAINING</div><h1 class="setup-heading">試験情報と、使い方</h1><p>'+EXAM.year+'年のJ.S.A.ソムリエ一般呼称を想定した非公式の練習ゲームです。二次試験は'+japaneseDate(EXAM.second)+'、三次のサービス実技は'+japaneseDate(EXAM.third)+'。論述は二次試験日に実施され、三次試験の審査対象です。</p><div class="notice">本番の問題、配点、合格基準、採点表を再現したものではありません。練習の正解率は合格可能性を示しません。</div><h2 style="margin-top:25px">使い方</h2><ol class="training-list"><li>最初は時間制限なしで、回答と解説を結び付けます。</li><li>テイスティングは文章で示した仮想ワインの練習。実物では外観、香り、味わいを自分で観察してください。</li><li>間違えた問題は「復習」に保存され、正解すると外れます。</li><li>論述は自分で書いた後に参考答案と比較。文字数や観点の自己確認で振り返ります。</li><li>サービスは判断問題と手順を学び、実物で動作を反復します。</li></ol><h2 style="margin-top:25px">ゲームのルール</h2><p class="small">正解20 XP、不正解5 XP。連続正解は2 XPずつ加算（最大10 XP）。ヒントを使った正解は基礎点10 XP。完走ボーナスは正解割合×20 XP（四捨五入）。300 XPごとにレベルが上がります。選択問題のステージバッジは1回80%以上、論述は150字以上の答案の振り返りで獲得します。サービスの手順・リハーサルは独立した練習で、実技の合否は判定しません。</p><h2 style="margin-top:25px">記録とHTML</h2><p class="small">学習記録と答案はこのブラウザー内に保存します。端末間では同期しません。ブラウザーのデータ削除で消える場合があります。「HTMLを保存」で、画像・問題・プログラムを含む1ファイルを保存できます。パソコンではHTMLをブラウザーで直接開けます。iPhone・iPadではこのサイトのURLをSafariで開く方法が便利です。</p><h2 style="margin-top:25px">参照した公開情報</h2><ul class="source-list"><li><a href="'+SOURCES.exam+'" target="_blank" rel="noopener noreferrer">日本ソムリエ協会：呼称資格認定試験・'+EXAM.year+'年日程</a></li><li><a href="'+SOURCES.guide+'" target="_blank" rel="noopener noreferrer">日本ソムリエ協会：初めての方へ・試験の構成</a></li><li><a href="'+SOURCES.tray+'" target="_blank" rel="noopener noreferrer">日本ソムリエ協会：トレーの使用方法（2026年8月28日掲載）</a><p class="small muted">告知の掲載を確認。本文は取得できなかったため、具体的な指定はゲームへ転記していません。</p></li><li><a href="'+SOURCES.tasting+'" target="_blank" rel="noopener noreferrer">WSET：テイスティング技能を高める方法</a></li><li><a href="'+SOURCES.sherry+'" target="_blank" rel="noopener noreferrer">シェリー原産地呼称統制委員会：シェリーのスタイル</a></li></ul><p class="small muted">2026年9月6日に確認。問題・解説・参考答案は独自に作成した練習用の例です。写真：<a href="https://unsplash.com/photos/wine-glass-behind-bottle-rgEHTLwaI_8" target="_blank" rel="noopener noreferrer">Mae Mu / Unsplash</a>（<a href="https://unsplash.com/license" target="_blank" rel="noopener noreferrer">Unsplash License</a>）。</p><div class="actions"><button class="ghost" data-action="home">ホームへ</button><button class="primary dark" data-action="download">HTMLを保存</button></div></section></div>')}
function download(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#xpHeader').innerHTML='';clone.querySelector('#schedule').innerHTML='';clone.querySelector('#storageWarning').innerHTML='';clone.querySelector('#reviewCount').textContent='0';clone.querySelector('#announcer').textContent='';clone.querySelector('#toast').hidden=true;clone.querySelector('#toast').textContent='';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sommelier-quest.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('HTMLの保存を開始しました。')}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;switch(action){case'home':home();break;case'stage':stage(el.dataset.id);break;case'quick':quick();break;case'start':startStage(el.dataset.id);break;case'choice':choose(Number(el.dataset.index));break;case'answer':answer();break;case'next':next();break;case'hint':if(session&&!session.answered){session.hinted=true;renderQuestion()}break;case'resume':session=normalizeSession(state.session);state.session=session;if(session&&Array.isArray(session.ids)&&session.ids.length&&session.index<session.ids.length){screen='quiz';if(!session.answered&&session.limit&&!session.deadline)session.deadline=Date.now()+session.remaining*1000;renderQuestion()}else{state.session=null;save();home()}break;case'retry':if(session.cat==='sequence')begin('sequence',SEQUENCE.map((_,i)=>'sequence-'+i));else begin(session.cat,shuffle(session.ids),session.limit);break;case'review':review();break;case'startReview':begin('review',shuffle(state.weak.filter(id=>BY_ID[id])).slice(0,10));break;case'sequence':begin('sequence',SEQUENCE.map((_,i)=>'sequence-'+i));break;case'essayReveal':essayReveal=true;$('essayReview').innerHTML=essayReviewHTML(ESSAYS.find(x=>x.id===essayId));$('essayReview').scrollIntoView({behavior:'smooth',block:'start'});break;case'essayNext':pauseAll();essayId=ESSAYS[(ESSAYS.findIndex(x=>x.id===essayId)+1)%ESSAYS.length].id;essayReveal=false;essayChecks=[];essayRemaining=300;renderEssay();break;case'essayTimer':if(essayDeadline){essayRemaining=Math.max(0,Math.ceil((essayDeadline-Date.now())/1000));essayDeadline=null;stopTick();el.textContent='再開'}else{if(essayRemaining<=0)essayRemaining=300;essayDeadline=Date.now()+essayRemaining*1000;el.textContent='一時停止';essayTick()}break;case'essayComplete':{const draft=$('essayText').value;if(essayChars(draft)<150){toast('150字以上の答案を書いてから振り返りましょう。');break}state.drafts[essayId]=draft;if(!state.essayDone.includes(essayId)){state.essayDone.push(essayId);state.xp+=40;state.seals.essay=true;touchDay();save();header();toast('振り返りを記録しました。＋40 XP')}else{save();toast('答案を保存しました。このテーマのXPは獲得済みです。')}break}case'rehearsal':renderRehearsal();break;case'rehearsalTimer':if(rehearsalDeadline){rehearsalRemaining=Math.max(0,Math.ceil((rehearsalDeadline-Date.now())/1000));rehearsalDeadline=null;stopTick();el.textContent='再開'}else{if(rehearsalRemaining<=0)rehearsalRemaining=420;rehearsalDeadline=Date.now()+rehearsalRemaining*1000;el.textContent='一時停止';rehearsalTick()}break;case'rehearsalReset':rehearsalDeadline=null;rehearsalRemaining=420;rehearsalChecks=Array(CHECKS.length).fill(false);renderRehearsal();break;case'rehearsalSave':state.rehearsal={date:day(),count:rehearsalChecks.filter(Boolean).length,total:CHECKS.length};touchDay();save();header();toast('実物での練習記録を保存しました。');break;case'sources':showSources();break;case'download':download();break}});
document.addEventListener('input',ev=>{if(ev.target.id==='essayText'){const t=ev.target.value;state.drafts[essayId]=t;$('charCount').innerHTML=essayChars(t)+'字 <span class="muted">／目安150〜220字</span>';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{save();if($('draftStatus'))$('draftStatus').textContent=storageOK?'自動保存しました':'保存できません'},300)}});
document.addEventListener('change',ev=>{if(ev.target.id==='essayTopic'){pauseAll();essayId=ev.target.value;essayReveal=false;essayChecks=[];essayRemaining=300;renderEssay()}if(ev.target.dataset.essayCheck!==undefined){const n=Number(ev.target.dataset.essayCheck);essayChecks=ev.target.checked?[...new Set([...essayChecks,n])]:essayChecks.filter(x=>x!==n);$('essaySelfScore').textContent='確認できた観点：'+essayChecks.length+' / '+ESSAYS.find(e=>e.id===essayId).points.length}if(ev.target.dataset.rehearsalCheck!==undefined){rehearsalChecks[Number(ev.target.dataset.rehearsalCheck)]=ev.target.checked;$('rehearsalScore').textContent='確認できた動作：'+rehearsalChecks.filter(Boolean).length+' / '+CHECKS.length}});

function validOrder(order,options){return Array.isArray(order)&&order.length===options.length&&new Set(order).size===order.length&&order.every(v=>options.includes(v))}
function normalizeSession(s){
 if(!s)return null;
 const valid=s&&Array.isArray(s.ids)&&s.ids.length&&Number.isInteger(s.index)&&s.index>=0&&s.index<s.ids.length&&Array.isArray(s.results)&&Array.isArray(s.choice)&&s.results.length===s.index+(s.answered?1:0)&&!s.finished&&s.results.every(r=>r&&Array.isArray(r.choice));
 const idsValid=valid&&(s.cat==='sequence'?s.ids.every((id,i)=>id==='sequence-'+i)&&s.ids.length===SEQUENCE.length:s.ids.every(id=>BY_ID[id]));
 if(!idsValid||(s.dataRevision&&s.dataRevision!==DATA_REVISION)){toast('問題更新のため挑戦を終了しました。学習記録は保持します。');return null}
 const q=s.cat==='sequence'?{options:SEQUENCE.map(x=>x[0])}:BY_ID[s.ids[s.index]];
 if(!validOrder(s.order,q.options)){if(s.answered){toast('問題更新のため挑戦を終了しました。学習記録は保持します。');return null}s.order=null;s.choice=[]}
 s.limit=[0,30,60].includes(s.limit)?s.limit:0;
 s.remaining=Number.isFinite(s.remaining)?Math.min(s.limit,Math.max(0,s.remaining)):s.limit;
 // Legacy absolute deadlines must never consume time while the document is closed.
 s.deadline=null;s.dataRevision=DATA_REVISION;return s;
}
function announce(text){clearTimeout(announceTimer);const el=$('announcer');el.textContent='';announceTimer=setTimeout(()=>{el.textContent=text},30)}
document.addEventListener('keydown',ev=>{
 if(screen!=='quiz'||!session||session.answered||ev.repeat||ev.altKey||ev.ctrlKey||ev.metaKey)return;
 if(ev.target.closest?.('input,textarea,select,[contenteditable="true"]'))return;
 const q=current(),k=ev.key.toLowerCase();let index=-1;
 if(/^[a-z]$/.test(k))index=k.charCodeAt(0)-97;
 else if(/^[1-9]$/.test(k))index=Number(k)-1;
 else if(!q.multi&&ev.target.closest?.('[role="radio"]')&&['ArrowLeft','ArrowUp','ArrowRight','ArrowDown','Home','End'].includes(ev.key)){
  const i=Number(ev.target.dataset.index);
  index=ev.key==='Home'?0:ev.key==='End'?session.order.length-1:(i+(['ArrowLeft','ArrowUp'].includes(ev.key)?-1:1)+session.order.length)%session.order.length;
 }
 if(index<0||index>=session.order.length)return;
 ev.preventDefault();choose(index);document.querySelector('[data-action="choice"][data-index="'+index+'"]')?.focus();
});

window.addEventListener('pagehide',()=>{pauseAll();save()});
window.addEventListener('pageshow',ev=>{if(!ev.persisted)return;if(screen==='quiz'&&session)renderQuestion();else if(screen==='essay')renderEssay();else if(screen==='rehearsal')renderRehearsal()});
state.session=normalizeSession(state.session);
save();
home();
</script></body></html>
